<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>资材出库申请</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; background: #f2f4f7; margin: 0; padding: 16px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; max-width: 460px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h2 { margin: 0 0 12px; color: #222; }
    .material { background: #eef6ff; border-radius: 8px; padding: 12px; margin-bottom: 14px; }
    .material .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 15px; }
    .material .row span:first-child { color: #666; }
    label { display: block; margin: 12px 0 4px; font-size: 15px; color: #333; }
    input, select { width: 100%; box-sizing: border-box; font-size: 18px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    button { width: 100%; margin-top: 20px; font-size: 20px; padding: 14px; background: #2f7d32; color: #fff; border: none; border-radius: 10px; }
    button:active { background: #256128; }
    .tip { margin-top: 12px; font-size: 14px; color: #888; }
  </style>
</head>
<body>
<div class="card">
  <h2>资材出库申请</h2>
  <div class="material">
    <div class="row"><span>资材代码</span><span id="m_code">-</span></div>
    <div class="row"><span>资材名称</span><span id="m_name">-</span></div>
    <div class="row"><span>规格</span><span id="m_spec">-</span></div>
  </div>

  <label>出库数量 *</label>
  <input type="number" id="qty" value="1" min="0.01" step="any">

  <label>部门 *</label>
  <select id="dept">
    <option value="JP607200|长春宝友二厂作业区">长春宝友二厂作业区</option>
    <option value="JP607900|长春宝友设备组">长春宝友设备组</option>
    <option value="JP206000|长春宝友生产部" selected>长春宝友生产部</option>
  </select>

  <label>机组 *</label>
  <select id="unit">
    <option value="P2|激光二号线">激光二号线</option>
    <option value="W3|设备组" selected>设备组</option>
  </select>

  <label>用途</label>
  <input type="text" id="usage" value="现场安全整改">

  <button type="button" onclick="submitForm()">提交申请</button>
  <p class="tip" id="tip">提交后会打开邮件应用，点「发送」即完成提交（后台自动收件处理）。</p>
</div>

<script>
// ============ 配置(部署前填写) ============
var MAIL_TO = "1963718876@qq.com"; // 接收出库申请的邮箱
// ==========================================

function getParam(name) {
  var m = location.search.match(new RegExp("[?&]" + name + "=([^&]+)"));
  return m ? decodeURIComponent(m[1]) : "";
}

var code = getParam("code") || "未知";
var name = getParam("name") || "";
var spec = getParam("spec") || "";

document.getElementById("m_code").textContent = code;
document.getElementById("m_name").textContent = name || "（扫码进入）";
document.getElementById("m_spec").textContent = spec || "-";

function collectFields() {
  var qty = document.getElementById("qty").value.trim();
  var dept = document.getElementById("dept").value;
  var unit = document.getElementById("unit").value;
  var usage = document.getElementById("usage").value.trim() || "现场安全整改";
  if (!qty || !dept || !unit) {
    alert("请填写数量和部门/机组");
    return null;
  }
  var deptParts = dept.split("|");
  var unitParts = unit.split("|");
  return {
    code: code,
    qty: qty,
    deptName: deptParts[1],
    deptId: deptParts[0],
    unitName: unitParts[1],
    unitCode: unitParts[0],
    usage: usage
  };
}

function submitForm() {
  var f = collectFields();
  if (!f) return;
  var body = [
    "资材代码: " + f.code,
    "出库数量: " + f.qty,
    "部门: " + f.deptName + " (" + f.deptId + ")",
    "机组: " + f.unitName + " (" + f.unitCode + ")",
    "用途: " + f.usage,
    "时间: " + new Date().toLocaleString()
  ].join("\n");
  var subject = "[出库]" + f.code;
  window.location.href = "mailto:" + MAIL_TO +
    "?subject=" + encodeURIComponent(subject) +
    "&body=" + encodeURIComponent(body);
  document.getElementById("tip").textContent = "已打开邮件应用，点「发送」完成提交。";
}
</script>
</body>
</html>
